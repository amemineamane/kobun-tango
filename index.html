<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>古文単語帳（プロトタイプ）</title>
<meta name="description" content="大学入試向け古文単語 330 語。関連語・例文の品詞分解・作品タグつき。ビルド不要の静的アプリ。">
<link rel="stylesheet" href="css/style.css?v=20260909e">
<!--
  ========================================================================
  古文単語帳アプリ（プロトタイプ）

  ・ビルド不要。この index.html をダブルクリックするだけで動く。
  ・file:// では fetch が CORS で弾かれるため、データは JSON ではなく
    「window.KOBUN に代入するだけの .js」として読み込んでいる。
  ・ES モジュール（type="module"）も file:// では CORS で弾かれるので、
    普通の <script> を順番に並べている。**順序に意味がある**:
        （data/*.js 同士の順序は問わないが、js/*.js より前であること）
        data/*.js   … データを window.KOBUN に載せる
        js/util.js  … 依存なしの道具
        js/store.js … localStorage
        js/data-index.js … データから索引をつくる（data/*.js の後）
        js/components.js … 共通部品（util / store / index の後）
        js/router.js     … ルーター
        js/view-*.js     … 各画面（components の後）
        js/app.js        … 起動（最後）
  ========================================================================
-->
</head>
<body>

<header class="site-header">
  <div class="site-header-inner">
    <h1 class="site-title"><a href="#/" data-nav="home">古文単語帳</a></h1>
    <!-- 下タブ（スマホ）は 5 個までに保ちたいので（いまは 4 個）、ホームはタイトル、
         使い方はヘッダ右のリンクから開く。どちらも全画面で常に見える。
         「作品」と「文章」は入口が二重で迷うので「教科書」1 つに統合した
         （#/textbook。作品ページ・文章ページもこのタブの中として点灯する）。 -->
    <nav class="site-nav" aria-label="メインメニュー">
      <a href="#/words" data-nav="words">
        <svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M4 5.5c2-1.2 5-1.2 7 0v13c-2-1.2-5-1.2-7 0v-13z"/>
          <path d="M20 5.5c-2-1.2-5-1.2-7 0v13c2-1.2 5-1.2 7 0v-13z"/>
        </svg>
        <span class="nav-label">単語</span>
      </a>
      <a href="#/textbook" data-nav="textbook">
        <!-- しおりを挟んだ本＝教科書。単語タブ（見開きの本）と形で区別する -->
        <svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M6 4.5A1.5 1.5 0 0 1 7.5 3H18v18H7.5A1.5 1.5 0 0 1 6 19.5v-15z"/>
          <path d="M6 17.5A1.5 1.5 0 0 1 7.5 16H18"/>
          <path d="M10.5 3v6.5l2-1.3 2 1.3V3"/>
        </svg>
        <span class="nav-label">教科書</span>
      </a>
      <a href="#/study" data-nav="study">
        <svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <rect x="4" y="6" width="16" height="12" rx="2"/>
          <line x1="4" y1="10.5" x2="20" y2="10.5"/>
          <line x1="8" y1="14.5" x2="14" y2="14.5"/>
        </svg>
        <span class="nav-label">学習</span>
      </a>
      <a href="#/quiz"  data-nav="quiz">
        <svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="8.5"/>
          <path d="M9.3 9.6a2.7 2.7 0 1 1 3.9 2.4c-.9.5-1.4 1-1.4 2"/>
          <circle cx="12" cy="16.8" r=".9" fill="currentColor" stroke="none"/>
        </svg>
        <span class="nav-label">クイズ</span>
      </a>
    </nav>
    <a class="site-help-link" href="#/help" data-nav="help">使い方</a>
  </div>
</header>

<div id="storage-warning" hidden>
  このブラウザでは localStorage が使えないため、学習履歴はページを閉じると消えます。
</div>

<main id="app">
  <div class="notice">
    <p>読み込み中…</p>
    <p class="muted">この表示のまま変わらない場合は、ブラウザのコンソール（F12）でエラーを確認してください。</p>
  </div>
</main>

<footer class="site-footer">
  <p id="footer-stat"></p>
</footer>

<script src="js/app.js?v=20260909e"></script>

</body>
</html>
