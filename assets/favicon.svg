<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="古文単語帳">
  <!-- ブラウザのタブ用。小さく出るので線は減らし、「古」1 文字だけにする。
       assets/icon.svg（ホーム画面用）と同じ配色・同じ字。 -->
  <rect width="64" height="64" rx="12" fill="#f7f4ee"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="10.5" fill="none" stroke="#cfc4b0" stroke-width="3"/>
  <text x="32" y="33" text-anchor="middle" dominant-baseline="central"
        font-family="'Yu Mincho','YuMincho','Hiragino Mincho ProN','Noto Serif JP','MS PMincho',serif"
        font-size="44" fill="#2b2723">古</text>
</svg>
